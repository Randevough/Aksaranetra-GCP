name: Deploy AksaraNetra to GCE

on:
  push:
    branches:
      - main

env:
  GAR_LOCATION: ${{ secrets.GAR_LOCATION }}
  GCP_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
  GAR_REPO: aksaranetra
  VM_NAME: ${{ secrets.GCE_INSTANCE_NAME }}
  VM_ZONE: ${{ secrets.GCE_INSTANCE_ZONE }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      - name: Build & Push PHP Backend Image
        run: |
          IMAGE_URI="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.GAR_REPO }}/backend"
          docker build -f php-backend/Dockerfile -t ${IMAGE_URI}:latest -t ${IMAGE_URI}:${{ github.sha }} .
          docker push ${IMAGE_URI}:latest
          docker push ${IMAGE_URI}:${{ github.sha }}

      - name: Build & Push Frontend Image
        run: |
          IMAGE_URI="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.GAR_REPO }}/frontend"
          docker build -f Dockerfile.frontend -t ${IMAGE_URI}:latest -t ${IMAGE_URI}:${{ github.sha }} .
          docker push ${IMAGE_URI}:latest
          docker push ${IMAGE_URI}:${{ github.sha }}

      - name: Deploy to Compute Engine VM
        run: |
          gcloud compute ssh ${{ env.VM_NAME }} --zone=${{ env.VM_ZONE }} --command="
            set -e
            cd /home/\$USER/aksaranetra
            gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet
            export GAR_LOCATION=${{ env.GAR_LOCATION }}
            export GCP_PROJECT=${{ env.GCP_PROJECT }}
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -af --filter 'until=48h'
          "
