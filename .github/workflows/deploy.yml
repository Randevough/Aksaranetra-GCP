name: Deploy AksaraNetra to GCE

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  GAR_LOCATION: ${{ secrets.GAR_LOCATION || 'asia-southeast2' }}
  GCP_PROJECT: ${{ secrets.GCP_PROJECT_ID || 'linear-ellipse-513814-b9' }}
  GAR_REPO: aksaranetra
  NEXT_PUBLIC_AUDIT_API_URL: /api
  VM_NAME: ${{ secrets.GCE_INSTANCE_NAME || 'aksaranetra-vm' }}
  VM_ZONE: ${{ secrets.GCE_INSTANCE_ZONE || 'asia-southeast2-a' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      - name: Build & Push PHP Backend Image
        run: |
          IMAGE_URI="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.GAR_REPO }}/backend"
          docker build -f php-backend/Dockerfile -t ${IMAGE_URI}:latest -t ${IMAGE_URI}:${{ github.sha }} .
          docker push ${IMAGE_URI}:latest
          docker push ${IMAGE_URI}:${{ github.sha }}

      - name: Build & Push Frontend Image
        run: |
          IMAGE_URI="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.GAR_REPO }}/frontend"
          docker build -f Dockerfile.frontend --build-arg NEXT_PUBLIC_AUDIT_API_URL="$NEXT_PUBLIC_AUDIT_API_URL" -t ${IMAGE_URI}:latest -t ${IMAGE_URI}:${{ github.sha }} .
          docker push ${IMAGE_URI}:latest
          docker push ${IMAGE_URI}:${{ github.sha }}

      - name: Deploy to Compute Engine VM
        run: |
          gcloud compute ssh ${{ env.VM_NAME }} --project=${{ env.GCP_PROJECT }} --zone=${{ env.VM_ZONE }} -- "mkdir -p ~/aksaranetra"
          gcloud compute scp docker-compose.prod.yml Caddyfile docker-compose.prod-ha.yml ${{ env.VM_NAME }}:~/aksaranetra/ --project=${{ env.GCP_PROJECT }} --zone=${{ env.VM_ZONE }}
          gcloud compute ssh ${{ env.VM_NAME }} --project=${{ env.GCP_PROJECT }} --zone=${{ env.VM_ZONE }} -- "bash -c '
            set -e
            cd ~/aksaranetra
            if [ ! -f backend.env ]; then
              cat << \"EOF\" > backend.env
          APP_NAME=AksaraNetra
          APP_ENV=production
          APP_DEBUG=false
          PORT=8787
          HOST=0.0.0.0
          FRONTEND_ORIGINS=*
          BACKEND_SECRET=$(openssl rand -hex 32)
          BACKEND_DATA_DIR=/data
          TRUST_PROXY=1
          AUDIT_TIMEOUT_MS=180000
          RESULT_RETENTION_MS=604800000
          CHROMIUM_LOW_RESOURCE_MODE=1
          EOF
            fi
            gcloud auth print-access-token | sudo -H docker login --username oauth2accesstoken --password-stdin https://${{ env.GAR_LOCATION }}-docker.pkg.dev
            set -- -f docker-compose.prod.yml
            if sudo grep -qx \"HA_MODE=1\" backend.env; then
              set -- \"\$@\" -f docker-compose.prod-ha.yml
            fi
            sudo -H env GAR_LOCATION=${{ env.GAR_LOCATION }} GCP_PROJECT=${{ env.GCP_PROJECT }} docker compose \"\$@\" pull
            sudo -H env GAR_LOCATION=${{ env.GAR_LOCATION }} GCP_PROJECT=${{ env.GCP_PROJECT }} docker compose \"\$@\" up -d --remove-orphans
            sudo -H docker image prune -af --filter \"until=48h\"
          '"
