name: PHP tests

on:
  push:
    branches: [ci/php-test-baseline]
  pull_request:
    paths:
      - php-backend/**
      - engine/**
      - .github/workflows/php-tests.yml

permissions:
  contents: read

jobs:
  php-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: php-backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, dom, xml, xmlwriter, mbstring
          tools: composer:2
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked PHP dependencies (including dev)
        run: composer install --no-interaction --prefer-dist --no-progress --no-plugins
      - name: Run all existing PHP tests
        run: vendor/bin/phpunit
