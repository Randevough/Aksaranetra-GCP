services:
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend-api

  frontend:
    image: ${GAR_LOCATION}-docker.pkg.dev/${GCP_PROJECT}/aksaranetra/frontend:latest
    container_name: aksaranetra-frontend
    restart: always
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_BACKEND_URL=/api
      - NEXT_PUBLIC_AUDIT_API_URL=/api
    depends_on:
      - backend-api

  backend-api:
    image: ${GAR_LOCATION}-docker.pkg.dev/${GCP_PROJECT}/aksaranetra/backend:latest
    container_name: aksaranetra-backend-api
    command: ["api"]
    restart: always
    env_file:
      - ./backend.env
    environment:
      FRONTEND_ORIGINS: https://aksaranetra.rafifernanda.site
    volumes:
      - aksara_data:/data
    shm_size: '1gb'

  backend-worker:
    image: ${GAR_LOCATION}-docker.pkg.dev/${GCP_PROJECT}/aksaranetra/backend:latest
    container_name: aksaranetra-backend-worker
    command: ["worker"]
    restart: always
    env_file:
      - ./backend.env
    volumes:
      - aksara_data:/data
    shm_size: '1gb'
    depends_on:
      - backend-api

volumes:
  aksara_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
