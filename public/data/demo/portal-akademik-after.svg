  <rect x="1132" y="44" width="84" height="40" rx="8" fill="#1d4ed8"/>
  <text x="1158" y="69" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Cari</text>

  <!-- Alert box with accessible contrast -->
  <rect x="272" y="124" width="968" height="54" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="296" y="156" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#991b1b">Peringatan: Batas pengisian KRS berakhir 2 hari lagi. Pilih minimal 18 SKS.</text>

  <!-- Table with proper headers & labeled buttons -->
  <rect x="272" y="202" width="968" height="420" rx="14" fill="#ffffff" stroke="#94a3b8"/>
  <rect x="272" y="202" width="968" height="48" rx="14" fill="#f1f5f9"/>
  <text x="296" y="231" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#0f172a">KODE</text>
  <text x="410" y="231" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#0f172a">MATA KULIAH</text>
  <text x="780" y="231" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#0f172a">SKS</text>
  <text x="880" y="231" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#0f172a">DOSEN</text>
  <text x="1100" y="231" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#0f172a">AKSI</text>

  <text x="296" y="292" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#0f172a">IF301</text>
  <text x="410" y="292" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Interaksi Manusia dan Komputer</text>
  <text x="780" y="292" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#0f172a">3</text>
  <text x="880" y="292" font-family="system-ui, sans-serif" font-size="14" fill="#334155">Dr. Andi Pratama</text>
  <rect x="1096" y="270" width="104" height="34" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="1112" y="292" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e3a8a">+ Tambah</text>

  <line x1="296" y1="322" x2="1216" y2="322" stroke="#cbd5e1"/>
  <text x="296" y="362" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#0f172a">IF304</text>
  <text x="410" y="362" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Rekayasa Perangkat Lunak</text>
