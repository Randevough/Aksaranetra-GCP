  <rect x="16" y="126" width="208" height="36" rx="8" fill="#1d4ed8"/>
  <text x="28" y="149" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Kartu Rencana Studi</text>
  <text x="28" y="188" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">Transkrip Nilai</text>
  <text x="28" y="228" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">Jadwal Kuliah</text>

  <!-- Main Panel -->
  <rect x="272" y="28" width="968" height="72" rx="12" fill="#ffffff" stroke="#94a3b8"/>
