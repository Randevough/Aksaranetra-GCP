<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" role="img" aria-label="Tangkapan layar simulasi Portal Akademik Kampus setelah perbaikan aksesibilitas">
  <rect width="1280" height="800" fill="#ffffff"/>
