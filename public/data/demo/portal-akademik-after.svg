  <text x="880" y="362" font-family="system-ui, sans-serif" font-size="14" fill="#334155">Dr. Sari Lestari</text>
  <rect x="1096" y="340" width="104" height="34" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="1112" y="362" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e3a8a">+ Tambah</text>

  <rect x="272" y="656" width="968" height="64" rx="12" fill="#ffffff" stroke="#94a3b8"/>
  <text x="296" y="694" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#334155">Menampilkan 2 dari 24 mata kuliah</text>
  <rect x="1080" y="670" width="136" height="36" rx="8" fill="#1d4ed8"/>
  <text x="1110" y="693" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Simpan KRS</text>
