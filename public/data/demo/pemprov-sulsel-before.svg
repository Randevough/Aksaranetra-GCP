<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" role="img" aria-label="Tangkapan layar simulasi Portal Pemerintah Provinsi Sulawesi Selatan sebelum perbaikan">
  <rect width="1280" height="800" fill="#f8fafc"/>
  <!-- Top Header -->
  <rect width="1280" height="72" fill="#ffffff"/>
  <line x1="0" y1="72" x2="1280" y2="72" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="48" y="20" width="36" height="36" rx="8" fill="#1d4ed8"/>
  <text x="96" y="44" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#0f172a">PEMPROV SULSEL</text>
  <text x="420" y="42" font-family="system-ui, sans-serif" font-size="14" fill="#64748b">Beranda</text>
  <text x="510" y="42" font-family="system-ui, sans-serif" font-size="14" fill="#64748b">Layanan Publik</text>
  <text x="640" y="42" font-family="system-ui, sans-serif" font-size="14" fill="#64748b">PPID</text>
  <text x="710" y="42" font-family="system-ui, sans-serif" font-size="14" fill="#64748b">Berita</text>
  <!-- Unlabeled search icon button -->
  <rect x="1116" y="18" width="40" height="40" rx="8" fill="#e2e8f0"/>
  <circle cx="1134" cy="36" r="7" fill="none" stroke="#64748b" stroke-width="2"/>
  <line x1="1139" y1="41" x2="1145" y2="47" stroke="#64748b" stroke-width="2"/>
  <!-- Unlabeled menu button -->
  <rect x="1172" y="18" width="40" height="40" rx="8" fill="#e2e8f0"/>
  <line x1="1182" y1="31" x2="1202" y2="31" stroke="#64748b" stroke-width="2"/>
  <line x1="1182" y1="38" x2="1202" y2="38" stroke="#64748b" stroke-width="2"/>
  <line x1="1182" y1="45" x2="1202" y2="45" stroke="#64748b" stroke-width="2"/>

  <!-- Hero Banner with low contrast text -->
  <rect x="48" y="96" width="1184" height="240" rx="16" fill="#dbeafe"/>
  <rect x="92" y="136" width="210" height="26" rx="13" fill="#bfdbfe"/>
  <text x="108" y="153" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#93c5fd">PORTAL RESMI DAERAH</text>
  <!-- Low contrast hero title -->
  <text x="92" y="200" font-family="system-ui, sans-serif" font-size="32" font-weight="800" fill="#60a5fa">Layanan Publik Terpadu Sulawesi Selatan</text>
  <text x="92" y="232" font-family="system-ui, sans-serif" font-size="16" fill="#93c5fd">Akses informasi perizinan, PPID, dan pengaduan masyarakat.</text>
  <rect x="92" y="258" width="180" height="44" rx="8" fill="#93c5fd"/>
  <text x="122" y="286" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Klik di sini</text>

  <!-- Hero banner image missing alt -->
  <rect x="860" y="122" width="320" height="186" rx="12" fill="#cbd5e1"/>
  <rect x="975" y="185" width="90" height="60" rx="6" fill="#94a3b8"/>
  <text x="935" y="275" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">banner-layanan.jpg (tanpa alt)</text>

  <!-- News Cards (skipped heading h4 without h2/h3, low contrast date) -->
  <text x="48" y="382" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#1e293b">Berita &amp; Pengumuman Terkini</text>

  <rect x="48" y="406" width="374" height="260" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="68" y="426" width="334" height="120" rx="8" fill="#e2e8f0"/>
  <text x="180" y="492" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Foto Rapat (tanpa alt)</text>
  <text x="68" y="574" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Rapat Koordinasi SPBE 2026</text>
  <text x="68" y="598" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">12 November 2026 · Diskominfo</text>
  <text x="68" y="636" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#60a5fa">Selengkapnya</text>

  <rect x="453" y="406" width="374" height="260" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="473" y="426" width="334" height="120" rx="8" fill="#e2e8f0"/>
  <text x="473" y="574" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Laporan Keuangan Daerah Triwulan III</text>
  <text x="473" y="598" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">10 November 2026 · BPKAD</text>
  <text x="473" y="636" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#60a5fa">Unduh Dokumen</text>

  <rect x="858" y="406" width="374" height="260" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="878" y="426" width="334" height="120" rx="8" fill="#e2e8f0"/>
  <text x="878" y="574" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Jadwal Layanan Pengaduan Publik</text>
  <text x="878" y="598" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">08 November 2026 · PPID</text>
  <text x="878" y="636" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#60a5fa">Buka Formulir</text>

  <!-- Sticky bottom cookie/info bar obscuring focusable link -->
  <rect x="0" y="728" width="1280" height="72" fill="#1e293b" opacity="0.94"/>
  <text x="48" y="770" font-family="system-ui, sans-serif" font-size="14" fill="#cbd5e1">Banner lengket menutupi tautan footer di belakangnya</text>
  <rect x="1080" y="744" width="152" height="40" rx="20" fill="#475569"/>
  <text x="1128" y="769" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Tutup</text>
</svg>
