<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" role="img" aria-label="Tangkapan layar simulasi Portal Pemerintah Provinsi Sulawesi Selatan setelah perbaikan aksesibilitas">
  <rect width="1280" height="800" fill="#ffffff"/>
  <!-- Top Header with visible focus & labeled buttons -->
  <rect width="1280" height="72" fill="#ffffff"/>
  <line x1="0" y1="72" x2="1280" y2="72" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="48" y="20" width="36" height="36" rx="8" fill="#1e40af"/>
  <text x="96" y="44" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#0f172a">PEMPROV SULSEL</text>
  <text x="420" y="42" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1e293b">Beranda</text>
  <text x="510" y="42" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1e293b">Layanan Publik</text>
  <text x="640" y="42" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1e293b">PPID</text>
  <text x="710" y="42" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1e293b">Berita</text>
  <!-- Labeled search button with focus ring -->
  <rect x="1032" y="18" width="108" height="40" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="1062" y="43" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1e3a8a">Cari</text>
  <rect x="1152" y="18" width="80" height="40" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="1172" y="43" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Menu</text>

  <!-- Hero Banner with AAA contrast -->
  <rect x="48" y="96" width="1184" height="240" rx="16" fill="#0f172a"/>
  <rect x="92" y="136" width="210" height="26" rx="13" fill="#1e3a8a"/>
  <text x="108" y="153" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#e0f2fe">PORTAL RESMI DAERAH</text>
  <text x="92" y="200" font-family="system-ui, sans-serif" font-size="32" font-weight="800" fill="#ffffff">Layanan Publik Terpadu Sulawesi Selatan</text>
  <text x="92" y="232" font-family="system-ui, sans-serif" font-size="16" fill="#e2e8f0">Akses informasi perizinan, PPID, dan pengaduan masyarakat.</text>
  <rect x="92" y="258" width="220" height="44" rx="8" fill="#2563eb"/>
  <text x="118" y="286" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Buka Portal Layanan</text>

  <!-- Hero image marked for review -->
  <rect x="860" y="122" width="320" height="186" rx="12" fill="#1e293b" stroke="#64748b"/>
  <rect x="975" y="175" width="90" height="60" rx="6" fill="#334155"/>
  <text x="900" y="265" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Perlu tinjauan manual: deskripsi alt</text>

  <!-- News Cards with high contrast & proper headings -->
  <text x="48" y="382" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#0f172a">Berita &amp; Pengumuman Terkini</text>

  <rect x="48" y="406" width="374" height="260" rx="14" fill="#ffffff" stroke="#94a3b8"/>
  <rect x="68" y="426" width="334" height="120" rx="8" fill="#f1f5f9"/>
  <text x="68" y="574" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Rapat Koordinasi SPBE 2026</text>
  <text x="68" y="598" font-family="system-ui, sans-serif" font-size="13" fill="#475569">12 November 2026 · Diskominfo</text>
  <text x="68" y="636" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1d4ed8">Baca Rapat Koordinasi SPBE 2026</text>

  <rect x="453" y="406" width="374" height="260" rx="14" fill="#ffffff" stroke="#94a3b8"/>
  <rect x="473" y="426" width="334" height="120" rx="8" fill="#f1f5f9"/>
  <text x="473" y="574" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Laporan Keuangan Daerah Triwulan III</text>
  <text x="473" y="598" font-family="system-ui, sans-serif" font-size="13" fill="#475569">10 November 2026 · BPKAD</text>
  <text x="473" y="636" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1d4ed8">Unduh Laporan Triwulan III (PDF)</text>

  <rect x="858" y="406" width="374" height="260" rx="14" fill="#ffffff" stroke="#94a3b8"/>
  <rect x="878" y="426" width="334" height="120" rx="8" fill="#f1f5f9"/>
  <text x="878" y="574" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Jadwal Layanan Pengaduan Publik</text>
  <text x="878" y="598" font-family="system-ui, sans-serif" font-size="13" fill="#475569">08 November 2026 · PPID</text>
  <text x="878" y="636" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1d4ed8">Buka Formulir Pengaduan</text>

  <!-- Clean footer spacer without obscuring sticky bar -->
  <rect x="48" y="706" width="1184" height="58" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="72" y="741" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Tautan footer terbaca jelas tanpa tertutup panel lengket (scroll-padding aman)</text>
</svg>
